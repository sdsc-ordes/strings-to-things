[project]
name = "strings2things"
authors = [
  { name = "Robin Franken", email = "robin.franken@epfl.ch" },
  { name = "Martin Fontanet", email = "martin.fontanet@epfl.ch" },
]
description = "This a repository turns strings into things"
requires-python = ">=3.11"
version = "0.0.1"

dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "openai-agents>=0.0.8",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "pyfuzon>=0.3.0",
    "pytest>=8.4.1",
    "python-multipart>=0.0.20",
    "rdflib>=7.1.4",
    "SPARQLWrapper>=2.0.0",
    "rapidfuzz>=3.0.0",
    "typer>=0.12.5",
]
[dependency-groups]
dev = [
    "notebook>=7.3.2",
]

[project.scripts]
# Primary multi-command CLI (Typer based)
strings2things = 'strings2things.cli:app'
# Shortcut to launch API server directly
strings2things-serve = 'strings2things.cli:serve'
# Backward compatibility alias if previous users relied on `cli`
cli = 'strings2things.cli:app'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".direnv",
    ".devenv",
    ".output",
]

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "W605",   # pycodestyle: invalid-escape-sequence
    "S102",   # flake8-bandit: exec-builtin
    "INP",    # flake8-no-pep420
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "NPY002", # numpy-legacy-random
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]
"[!t][!e][!s][!t][!s]*/**" = ["PT"]
